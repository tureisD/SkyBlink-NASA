<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">How SPHEREx SkyBlink works</title>
  <desc id="desc">Pick a target, press play to blink survey passes, check the warning panel, then read the spectrum.</desc>
  <rect width="1200" height="270" rx="10" fill="#08090b"/>
  <text x="28" y="38" fill="#eef1f5" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="700">How it works</text>
  <text x="28" y="62" fill="#8b96a8" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.2">THE SAME PATCH OF SKY, ONE SURVEY PASS AT A TIME</text>

  <!-- Step 1 -->
  <g>
    <rect x="28" y="92" width="252" height="144" rx="8" fill="#0e1015" stroke="#252a33"/>
    <circle cx="60" cy="124" r="18" fill="#102a36" stroke="#38bdf8"/>
    <circle cx="60" cy="124" r="7" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
    <path d="M60 101v8M60 139v8M37 124h8M75 124h8" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="90" y="120" fill="#eef1f5" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700">1. Pick a target</text>
    <text x="46" y="160" fill="#a9b4c4" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13">Choose WISE 0855, Barnard's Star,</text>
    <text x="46" y="180" fill="#a9b4c4" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13">Epsilon Indi B, RW Aurigae,</text>
    <text x="46" y="200" fill="#a9b4c4" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13">R Draconis, or paste coordinates.</text>
  </g>
  <path d="M292 164h34" stroke="#38bdf8" stroke-width="1.6"/>
  <path d="M320 158l8 6-8 6" fill="none" stroke="#38bdf8" stroke-width="1.6"/>

  <!-- Step 2 -->
  <g>
    <rect x="338" y="92" width="252" height="144" rx="8" fill="#0e1015" stroke="#252a33"/>
    <circle cx="370" cy="124" r="18" fill="#102a36" stroke="#38bdf8"/>
    <path d="M364 115l16 9-16 9z" fill="#38bdf8"/>
    <text x="400" y="120" fill="#eef1f5" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700">2. Press play</text>
    <text x="356" y="160" fill="#a9b4c4" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13">The viewer flips through the</text>
    <text x="356" y="180" fill="#a9b4c4" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13">available survey passes at 4 FPS.</text>
    <text x="356" y="200" fill="#a9b4c4" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13">Static stars stay still; movers move.</text>
  </g>
  <path d="M602 164h34" stroke="#38bdf8" stroke-width="1.6"/>
  <path d="M630 158l8 6-8 6" fill="none" stroke="#38bdf8" stroke-width="1.6"/>

  <!-- Step 3 -->
  <g>
    <rect x="648" y="92" width="252" height="144" rx="8" fill="#0e1015" stroke="#252a33"/>
    <circle cx="680" cy="124" r="18" fill="#102a36" stroke="#fbbf24"/>
    <path d="M680 108l12 5v9c0 8-6 14-12 16-6-2-12-8-12-16v-9z" fill="none" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="710" y="120" fill="#eef1f5" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700">3. Check warnings</text>
    <text x="666" y="160" fill="#a9b4c4" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13">The Artifact Shield explains</text>
    <text x="666" y="180" fill="#a9b4c4" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13">saturation, halos, cosmic rays</text>
    <text x="666" y="200" fill="#a9b4c4" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13">and other pixel warnings.</text>
  </g>
  <path d="M912 164h34" stroke="#38bdf8" stroke-width="1.6"/>
  <path d="M940 158l8 6-8 6" fill="none" stroke="#38bdf8" stroke-width="1.6"/>

  <!-- Step 4 -->
  <g>
    <rect x="958" y="92" width="214" height="144" rx="8" fill="#0e1015" stroke="#252a33"/>
    <circle cx="990" cy="124" r="18" fill="#102a36" stroke="#38bdf8"/>
    <path d="M980 132l7-8 6 4 9-13" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="1020" y="120" fill="#eef1f5" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700">4. Read spectrum</text>
    <text x="976" y="160" fill="#a9b4c4" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13">Open the spectrum drawer</text>
    <text x="976" y="180" fill="#a9b4c4" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13">to see brightness versus</text>
    <text x="976" y="200" fill="#a9b4c4" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13">wavelength, with error bars.</text>
  </g>
</svg>
