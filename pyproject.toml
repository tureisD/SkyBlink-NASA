# Runtime dependencies for the Vercel deployment (see server.py and
# vercel.json). Local development and tests keep using
# backend/requirements.txt, which also carries the test tools.
[project]
name = "skyblink-nasa"
version = "1.6.0"
description = "SPHEREx SkyBlink: blink NASA SPHEREx survey passes in the browser"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "numpy>=1.26",
  "scipy>=1.13",
  "astropy>=6.1",
  "reproject>=0.14",
  "photutils>=1.13",
  "sep>=1.4",
  "pillow>=10.4",
  "diskcache>=5.6",
  "httpx>=0.27",
  "pyvo>=1.5",
  "python-dotenv>=1.0",
]
