services:
  skyblink:
    build:
      context: .
      dockerfile: Dockerfile
    image: skyblink:local
    init: true
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      CACHE_DIR: /data/cache
      GOLDEN_CACHE_DIR: /app/golden_cache
      SPHEREX_FRONTEND_DIST: /app/frontend/dist
      LOG_LEVEL: INFO
    volumes:
      # Live query results and downloaded cutouts persist across restarts.
      - skyblink-cache:/data/cache
    mem_limit: 2g
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=15).status == 200 else 1)"
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

volumes:
  skyblink-cache:
